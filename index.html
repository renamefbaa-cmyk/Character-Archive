
```html
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHARACTER ARCHIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #090a0f;
      --bg-sidebar: #0d0e14;
      --bg-surface: #14161f;
      --bg-surface-hover: #191c27;
      --bg-elevated: #1c1f2c;
      --bg-input: #11131b;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-medium: rgba(255, 255, 255, 0.13);
      --text-primary: #f4f5f8;
      --text-secondary: #a1a7b8;
      --text-muted: #686e82;

      --pastel-lavender: #a78bfa;
      --pastel-mint: #67dcc5;
      --pastel-rose: #f4a8c8;
      --pastel-champagne: #f5cd8c;
      --pastel-gradient: linear-gradient(135deg, #a78bfa 0%, #67dcc5 52%, #f4a8c8 100%);

      --sidebar-width: 244px;
      --sidebar-collapsed-width: 74px;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --radius-pill: 9999px;
      --transition-smooth: 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      color-scheme: dark;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.55;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Ambient Decorative Glow Backdrop */
    .ambient-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      transition: opacity 0.4s ease;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.14;
    }

    .ambient-orb-1 {
      width: 520px;
      height: 520px;
      top: -180px;
      left: 16%;
      background: radial-gradient(circle, #a78bfa, transparent 70%);
    }

    .ambient-orb-2 {
      width: 440px;
      height: 440px;
      top: 10%;
      right: -120px;
      background: radial-gradient(circle, #67dcc5, transparent 70%);
    }

    .ambient-orb-3 {
      width: 420px;
      height: 420px;
      bottom: -180px;
      left: 42%;
      background: radial-gradient(circle, #f4a8c8, transparent 70%);
    }

    body.no-effects .ambient-backdrop,
    body.no-effects .card-aura,
    body.no-effects .detail-ambient-glow {
      display: none !important;
    }

    body.no-effects .char-card:hover {
      box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.7) !important;
      transform: translateY(-2px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* App Layout */
    .app-shell {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--sidebar-width);
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      z-index: 50;
      transition: width var(--transition-smooth), padding var(--transition-smooth);
    }

    body.sidebar-collapsed .sidebar {
      width: var(--sidebar-collapsed-width);
      padding: 20px 12px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 6px 20px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 18px;
      min-height: 54px;
    }

    .brand-mark-wrap {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      overflow: hidden;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.2), rgba(103, 220, 197, 0.16));
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: var(--text-primary);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .brand-text {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.2s ease, width 0.2s ease;
    }

    body.sidebar-collapsed .brand-text {
      opacity: 0;
      width: 0;
      pointer-events: none;
    }

    .sidebar-toggle-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--transition-smooth), color var(--transition-smooth), transform var(--transition-smooth);
    }

    .sidebar-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      color: var(--text-primary);
    }

    body.sidebar-collapsed .sidebar-brand {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    body.sidebar-collapsed .brand-mark-wrap {
      display: none;
    }

    body.sidebar-collapsed .sidebar-toggle-btn svg {
      transform: rotate(180deg);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background var(--transition-smooth), color var(--transition-smooth), border-color var(--transition-smooth);
    }

    body.sidebar-collapsed .nav-item {
      justify-content: center;
      padding: 11px 0;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: linear-gradient(90deg, rgba(167, 139, 250, 0.14), rgba(103, 220, 197, 0.06));
      border-color: rgba(167, 139, 250, 0.25);
      color: var(--text-primary);
      font-weight: 600;
    }

    .nav-item.active::before {
      content: "";
      position: absolute;
      left: -14px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 22px;
      border-radius: 0 4px 4px 0;
      background: var(--pastel-gradient);
    }

    body.sidebar-collapsed .nav-item.active::before {
      left: -12px;
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .nav-label {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .nav-item.active .nav-badge {
      background: rgba(167, 139, 250, 0.2);
      color: #e4dcff;
    }

    body.sidebar-collapsed .nav-label,
    body.sidebar-collapsed .nav-badge {
      display: none;
    }

    /* Tooltip on Sidebar Hover */
    .nav-item::after {
      content: attr(data-tooltip);
      position: absolute;
      left: calc(100% + 14px);
      top: 50%;
      transform: translateY(-50%) translateX(-4px);
      padding: 6px 11px;
      border-radius: 8px;
      background: #1c1f2b;
      border: 1px solid var(--border-medium);
      color: var(--text-primary);
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5);
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 120;
    }

    .nav-item:hover::after {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }

    .sidebar-footer {
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 0.75rem;
      padding-inline: 6px;
    }

    .sidebar-footer-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pastel-mint);
      box-shadow: 0 0 10px rgba(103, 220, 197, 0.6);
      flex-shrink: 0;
    }

    body.sidebar-collapsed .sidebar-footer {
      justify-content: center;
      padding-inline: 0;
    }

    body.sidebar-collapsed .sidebar-footer-text {
      display: none;
    }

    /* Main Workspace */
    .main-workspace {
      flex: 1;
      margin-left: var(--sidebar-width);
      min-width: 0;
      padding: 30px 36px 70px;
      transition: margin-left var(--transition-smooth);
    }

    body.sidebar-collapsed .main-workspace {
      margin-left: var(--sidebar-collapsed-width);
    }

    .workspace-inner {
      max-width: 1520px;
      margin: 0 auto;
    }

    /* Mobile Top Bar & Bottom Nav (hidden on desktop) */
    .mobile-topbar {
      display: none;
    }

    .mobile-bottom-nav {
      display: none;
    }

    /* Header Section */
    .archive-header {
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-hero {
      position: relative;
      padding: 26px 28px;
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, rgba(24, 26, 37, 0.92), rgba(16, 18, 26, 0.94));
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .header-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 88% 18%, rgba(167, 139, 250, 0.14), transparent 45%),
                  radial-gradient(circle at 12% 90%, rgba(103, 220, 197, 0.09), transparent 42%);
      pointer-events: none;
    }

    body.no-effects .header-hero::before {
      display: none;
    }

    .header-hero.compact {
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
    }

    .header-hero.compact::before {
      display: none;
    }

    .header-title-group {
      position: relative;
      z-index: 1;
      max-width: 700px;
    }

    .header-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 6px;
    }

    .archive-title {
      font-size: clamp(1.45rem, 2.5vw, 2.05rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: linear-gradient(95deg, #ffffff 10%, #d9d6fe 68%, #b9efe4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    .header-count-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-medium);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .header-count-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pastel-lavender);
    }

    .archive-subtitle {
      color: var(--text-secondary);
      font-size: 0.94rem;
      max-width: 58ch;
    }

    .hero-stats {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero-stat-box {
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border-subtle);
      min-width: 108px;
    }

    .hero-stat-value {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .hero-stat-label {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Search & Filter Toolbar */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .toolbar-main {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: grid;
      place-items: center;
    }

    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 40px 0 44px;
      border-radius: 13px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      font-size: 0.9rem;
      color: var(--text-primary);
      transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth), background var(--transition-smooth);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      outline: none;
      background: #141722;
      border-color: rgba(167, 139, 250, 0.45);
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.12);
    }

    .search-clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: none;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .search-clear-btn:hover {
      background: rgba(255, 255, 255, 0.13);
      color: var(--text-primary);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 15px;
      border-radius: 13px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-smooth);
    }

    .btn-ghost:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-medium);
      color: var(--text-primary);
    }

    .btn-ghost.active {
      background: rgba(167, 139, 250, 0.12);
      border-color: rgba(167, 139, 250, 0.35);
      color: var(--text-primary);
    }

    .badge-mini {
      padding: 1px 7px;
      border-radius: var(--radius-pill);
      background: rgba(167, 139, 250, 0.24);
      color: #e9e2ff;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
    }

    /* View Mode Segmented Switch */
    .segmented {
      display: inline-flex;
      align-items: center;
      padding: 4px;
      border-radius: 13px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      height: 44px;
    }

    .segmented-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.83rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .segmented-btn:hover {
      color: var(--text-secondary);
    }

    .segmented-btn.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* Hashtag Filter Panel */
    .hashtag-filter-panel {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: rgba(19, 21, 30, 0.85);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hashtag-filter-panel.hidden {
      display: none;
    }

    .filter-panel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-panel-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .filter-controls-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-switch {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 10px;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
    }

    .mode-btn {
      padding: 4px 10px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: rgba(167, 139, 250, 0.22);
      color: #eee9ff;
      box-shadow: inset 0 0 0 1px rgba(167, 139, 250, 0.4);
    }

    .clear-filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 9px;
      background: rgba(244, 168, 200, 0.1);
      border: 1px solid rgba(244, 168, 200, 0.25);
      color: #f6c3d9;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .clear-filter-btn:hover {
      background: rgba(244, 168, 200, 0.18);
      color: #ffffff;
    }

    .hashtag-list-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    /* Unified Hashtag Pill Style */
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #cfd4e2;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
      user-select: none;
      line-height: 1.3;
    }

    .tag-pill:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .tag-pill.selected {
      background: rgba(167, 139, 250, 0.2);
      border-color: rgba(167, 139, 250, 0.65);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(167, 139, 250, 0.22);
    }

    .tag-pill-count {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .tag-pill.selected .tag-pill-count {
      color: #dcd3ff;
    }

    .tag-pill.overflow-pill {
      cursor: pointer;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.73rem;
    }

    /* Active Filter Summary Strip */
    .active-filter-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(167, 139, 250, 0.07);
      border: 1px solid rgba(167, 139, 250, 0.2);
    }

    .active-filter-tags {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .active-results-text {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    /* Character Gallery - Masonry & Grid */
    .gallery-masonry {
      display: flex;
      align-items: flex-start;
      gap: 22px;
    }

    .masonry-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
    }

    /* Character Card */
    .char-card {
      --char-accent: #a78bfa;
      --char-accent-rgb: 167, 139, 250;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid rgba(var(--char-accent-rgb), 0.2);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--transition-smooth), border-color var(--transition-smooth), box-shadow var(--transition-smooth), background var(--transition-smooth);
      box-shadow: 0 10px 28px -14px rgba(0, 0, 0, 0.75);
      outline: none;
    }

    .gallery-grid .char-card {
      height: 100%;
    }

    .char-card:hover,
    .char-card:focus-visible {
      transform: translateY(-5px);
      background: var(--bg-surface-hover);
      border-color: rgba(var(--char-accent-rgb), 0.7);
      box-shadow:
        0 18px 40px -14px rgba(0, 0, 0, 0.82),
        0 0 28px -4px rgba(var(--char-accent-rgb), 0.34);
    }

    /* Top Accent Rim */
    .char-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--char-accent), transparent);
      opacity: 0.7;
      z-index: 4;
      transition: opacity var(--transition-smooth);
    }

    .char-card:hover::before {
      opacity: 1;
    }

    /* Decorative gradient aura behind avatar */
    .card-aura {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 110%;
      height: 220px;
      background: radial-gradient(circle at 50% 40%, rgba(var(--char-accent-rgb), 0.22), transparent 70%);
      pointer-events: none;
      z-index: 0;
      transition: opacity var(--transition-smooth);
    }

    .char-card:hover .card-aura {
      background: radial-gradient(circle at 50% 40%, rgba(var(--char-accent-rgb), 0.34), transparent 72%);
    }

    .card-media {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #0f1118;
      z-index: 1;
      flex-shrink: 0;
    }

    .gallery-masonry .card-media.img-loaded {
      aspect-ratio: auto;
    }

    .card-avatar-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      z-index: 2;
    }

    .gallery-masonry .card-media.img-loaded .card-avatar-img {
      height: auto;
      max-height: 460px;
    }

    .card-media.img-loaded .card-avatar-img {
      opacity: 1;
    }

    .char-card:hover .card-avatar-img {
      transform: scale(1.045);
    }

    .card-media::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 48%;
      background: linear-gradient(to top, var(--bg-surface) 0%, rgba(20, 22, 31, 0.55) 45%, transparent 100%);
      pointer-events: none;
      z-index: 3;
      transition: background var(--transition-smooth);
    }

    .char-card:hover .card-media::after {
      background: linear-gradient(to top, var(--bg-surface-hover) 0%, rgba(25, 28, 39, 0.55) 45%, transparent 100%);
    }

    /* Avatar Placeholder / Fallback */
    .avatar-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background:
        radial-gradient(circle at 50% 38%, rgba(var(--char-accent-rgb), 0.22), transparent 65%),
        linear-gradient(165deg, #171925 0%, #101119 100%);
      z-index: 1;
      padding: 20px;
      text-align: center;
    }

    .placeholder-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(var(--char-accent-rgb), 0.12);
      border: 1px solid rgba(var(--char-accent-rgb), 0.42);
      box-shadow: 0 0 28px rgba(var(--char-accent-rgb), 0.22);
      color: var(--text-primary);
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
    }

    .placeholder-caption {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .card-media.img-loaded .avatar-placeholder {
      opacity: 0;
      pointer-events: none;
    }

    /* Card Favorite Button */
    .fav-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(11, 12, 18, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.76);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.22s ease, background 0.22s ease, color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .fav-btn:hover {
      transform: scale(1.08);
      background: rgba(20, 22, 31, 0.88);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.28);
    }

    .fav-btn.is-fav {
      color: #ff7ba9;
      background: rgba(255, 123, 169, 0.16);
      border-color: rgba(255, 123, 169, 0.55);
      box-shadow: 0 0 18px rgba(255, 123, 169, 0.28);
    }

    .fav-btn svg {
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .fav-btn.is-fav svg {
      fill: currentColor;
      transform: scale(1.08);
    }

    /* Card Content */
    .card-body {
      position: relative;
      z-index: 4;
      padding: 4px 18px 18px;
      margin-top: -14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .char-accent-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--char-accent);
      box-shadow: 0 0 10px rgba(var(--char-accent-rgb), 0.75);
      flex-shrink: 0;
    }

    .card-name {
      font-size: 1.07rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .card-desc {
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.52;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .gallery-grid .card-desc {
      -webkit-line-clamp: 2;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
      padding-top: 4px;
    }

    .card-tags .tag-pill {
      padding: 4px 9px;
      font-size: 0.74rem;
    }

    /* Character Detail Page */
    .detail-page {
      --char-accent: #a78bfa;
      --char-accent-rgb: 167, 139, 250;
      position: relative;
      animation: fadeSlideIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .detail-ambient-glow {
      position: fixed;
      top: -120px;
      right: 8%;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--char-accent-rgb), 0.2), transparent 68%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .detail-topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 16px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-smooth);
    }

    .back-btn:hover {
      background: var(--bg-surface-hover);
      border-color: rgba(var(--char-accent-rgb), 0.45);
      transform: translateX(-2px);
    }

    .detail-fav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-smooth);
    }

    .detail-fav-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    .detail-fav-btn.is-fav {
      background: rgba(255, 123, 169, 0.14);
      border-color: rgba(255, 123, 169, 0.45);
      color: #ff9bbf;
      box-shadow: 0 0 22px rgba(255, 123, 169, 0.18);
    }

    .detail-fav-btn.is-fav svg {
      fill: currentColor;
    }

    .detail-layout {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(280px, 430px) minmax(0, 1fr);
      gap: 34px;
      align-items: start;
    }

    .detail-portrait-card {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--bg-surface);
      border: 1px solid rgba(var(--char-accent-rgb), 0.4);
      box-shadow:
        0 24px 54px -18px rgba(0, 0, 0, 0.85),
        0 0 40px -12px rgba(var(--char-accent-rgb), 0.28);
      aspect-ratio: 3 / 4;
    }

    .detail-portrait-card.img-loaded {
      aspect-ratio: auto;
    }

    .detail-portrait-img {
      width: 100%;
      height: 100%;
      max-height: 640px;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .detail-portrait-card.img-loaded .detail-portrait-img {
      height: auto;
      opacity: 1;
    }

    .detail-portrait-card.img-loaded .avatar-placeholder {
      opacity: 0;
      pointer-events: none;
    }

    .detail-info-panel {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 28px;
      border-radius: var(--radius-lg);
      background: rgba(20, 22, 31, 0.88);
      border: 1px solid var(--border-subtle);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      position: relative;
      overflow: hidden;
    }

    .detail-info-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--char-accent), rgba(var(--char-accent-rgb), 0.2), transparent);
    }

    .detail-header-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .detail-accent-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      background: rgba(var(--char-accent-rgb), 0.14);
      border: 1px solid rgba(var(--char-accent-rgb), 0.35);
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--text-primary);
    }

    .detail-name {
      font-size: clamp(1.75rem, 3vw, 2.45rem);
      font-weight: 700;
      line-height: 1.18;
      color: var(--text-primary);
      overflow-wrap: anywhere;
    }

    .detail-description {
      font-size: 0.98rem;
      line-height: 1.68;
      color: var(--text-secondary);
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .detail-section-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .detail-tags-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .detail-tags-wrap .tag-pill {
      padding: 6px 13px;
      font-size: 0.82rem;
    }

    .detail-tags-wrap .tag-pill:hover {
      border-color: rgba(var(--char-accent-rgb), 0.55);
      background: rgba(var(--char-accent-rgb), 0.14);
    }

    /* Story Link & View Link Cards */
    .detail-links-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .link-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      padding: 18px;
      border-radius: var(--radius-md);
      background: rgba(13, 15, 22, 0.8);
      border: 1px solid rgba(var(--char-accent-rgb), 0.22);
      transition: border-color var(--transition-smooth), background var(--transition-smooth);
    }

    .link-card:hover {
      border-color: rgba(var(--char-accent-rgb), 0.45);
      background: rgba(16, 18, 27, 0.96);
    }

    .link-card-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-card-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(var(--char-accent-rgb), 0.14);
      border: 1px solid rgba(var(--char-accent-rgb), 0.3);
      color: var(--char-accent);
      flex-shrink: 0;
    }

    .link-card-title {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .link-url-preview {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: rgba(255, 255, 255, 0.03);
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .link-card-actions {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .btn-accent {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex: 1;
      min-width: 120px;
      padding: 10px 14px;
      border-radius: 11px;
      background: rgba(var(--char-accent-rgb), 0.22);
      border: 1px solid rgba(var(--char-accent-rgb), 0.55);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-smooth);
    }

    .btn-accent:hover {
      background: rgba(var(--char-accent-rgb), 0.34);
      box-shadow: 0 6px 20px -4px rgba(var(--char-accent-rgb), 0.4);
      transform: translateY(-1px);
    }

    .btn-copy {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 13px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.83rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.11);
      color: var(--text-primary);
      border-color: var(--border-medium);
    }

    .link-empty-status {
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      font-size: 0.83rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Hashtag Library View */
    .library-header-card {
      padding: 24px 26px;
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, rgba(22, 24, 34, 0.94), rgba(15, 17, 25, 0.94));
      border: 1px solid var(--border-subtle);
      margin-bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .library-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .library-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .library-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hashtag-library-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .hashtag-lib-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px;
      border-radius: 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      text-align: left;
      transition: all var(--transition-smooth);
    }

    .hashtag-lib-card:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-medium);
      transform: translateY(-2px);
    }

    .hashtag-lib-card.selected {
      background: rgba(167, 139, 250, 0.14);
      border-color: rgba(167, 139, 250, 0.6);
      box-shadow: 0 8px 24px -10px rgba(167, 139, 250, 0.4);
    }

    .hashtag-lib-name {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-primary);
      overflow-wrap: anywhere;
    }

    .hashtag-lib-count {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-secondary);
      white-space: nowrap;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.05);
    }

    .hashtag-lib-card.selected .hashtag-lib-count {
      background: rgba(167, 139, 250, 0.25);
      color: #ede8ff;
    }

    .library-results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 0 18px;
      border-top: 1px solid var(--border-subtle);
    }

    .library-results-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Settings View */
    .settings-wrap {
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .settings-card {
      padding: 24px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .settings-card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .field-input, .field-textarea {
      width: 100%;
      padding: 11px 14px;
      border-radius: 11px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 0.9rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field-textarea {
      resize: vertical;
      min-height: 78px;
    }

    .field-input:focus, .field-textarea:focus {
      outline: none;
      border-color: rgba(167, 139, 250, 0.5);
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.12);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .setting-row-info h4 {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .setting-row-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      width: 48px;
      height: 27px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switch-slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .switch-slider::before {
      content: "";
      position: absolute;
      width: 19px;
      height: 19px;
      left: 3px;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 50%;
      background: #d8dce8;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), background 0.25s ease;
    }

    .switch input:checked + .switch-slider {
      background: rgba(167, 139, 250, 0.35);
      border-color: rgba(167, 139, 250, 0.7);
    }

    .switch input:checked + .switch-slider::before {
      transform: translate(21px, -50%);
      background: #ffffff;
    }

    /* Empty State */
    .empty-state {
      padding: 58px 24px;
      border-radius: var(--radius-lg);
      background: rgba(20, 22, 31, 0.6);
      border: 1px dashed rgba(255, 255, 255, 0.11);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .empty-icon-box {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(167, 139, 250, 0.14), rgba(103, 220, 197, 0.1));
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: grid;
      place-items: center;
      color: var(--pastel-lavender);
    }

    .empty-title {
      font-size: 1.08rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .empty-desc {
      font-size: 0.88rem;
      color: var(--text-secondary);
      max-width: 44ch;
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      padding: 11px 16px;
      border-radius: 12px;
      background: rgba(24, 27, 38, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-medium);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      gap: 9px;
      animation: toastIn 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .hidden {
      display: none !important;
    }

    /* Responsive Breakpoints */
    @media (max-width: 1320px) {
      .gallery-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 1024px) {
      .main-workspace {
        padding: 24px 24px 70px;
      }
      .detail-layout {
        grid-template-columns: minmax(250px, 340px) minmax(0, 1fr);
        gap: 24px;
      }
      .detail-links-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .main-workspace {
        margin-left: 0 !important;
        padding: 14px 16px 96px;
      }

      .mobile-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 2px 14px;
        margin-bottom: 10px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .mobile-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.84rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .mobile-bottom-nav {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 90;
        background: rgba(12, 13, 19, 0.92);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-top: 1px solid var(--border-subtle);
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
      }

      .mobile-nav-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 7px 4px;
        border-radius: 11px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 0.67rem;
        font-weight: 500;
        cursor: pointer;
        position: relative;
        transition: color 0.2s ease, background 0.2s ease;
      }

      .mobile-nav-btn.active {
        color: var(--text-primary);
        background: rgba(167, 139, 250, 0.14);
      }

      .mobile-nav-dot {
        position: absolute;
        top: 5px;
        right: calc(50% - 14px);
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--pastel-rose);
      }

      .header-hero {
        padding: 20px;
      }

      .detail-layout {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .detail-portrait-card {
        max-width: 440px;
        width: 100%;
        margin: 0 auto;
      }

      .detail-info-panel {
        padding: 20px;
      }

      .toast-container {
        bottom: 84px;
        right: 14px;
        left: 14px;
      }
    }

    @media (max-width: 520px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .toolbar-actions {
        width: 100%;
        justify-content: space-between;
      }

      .segmented-btn span.view-label {
        display: none;
      }

      .hashtag-library-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

      const els = {
