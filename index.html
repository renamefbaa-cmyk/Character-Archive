          // Ignore storage errors safely (e.g., private mode restriction)
        }
      }

      function loadSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.SETTINGS);
          if (!raw) return { ...DEFAULT_SETTINGS };
          const parsed = JSON.parse(raw);
          return {
            ...DEFAULT_SETTINGS,
            ...(parsed && typeof parsed === "object" ? parsed : {})
          };
        } catch {
          return { ...DEFAULT_SETTINGS };
        }
      }

      function saveSettings() {
        try {
          localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(state.settings));
        } catch {
          // Ignore storage errors safely
        }
      }

      function normalizeColor(inputColor) {
        const fallback = "#A78BFA";
        if (typeof inputColor !== "string" || !inputColor.trim()) return fallback;
        const val = inputColor.trim();
        const tester = new Option().style;
        tester.color = "";
        tester.color = val;
        return tester.color ? val : fallback;
      }

      function parseColorToRgb(colorStr) {
        const safeColor = normalizeColor(colorStr);
        // Handle #RGB and #RRGGBB directly
        const hexMatch = safeColor.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
        if (hexMatch) {
          let hex = hexMatch[1];
          if (hex.length === 3) {
            hex = hex.split("").map((c) => c + c).join("");
          }
          const num = parseInt(hex, 16);
          return `${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}`;
        }
        // Fallback: compute via DOM element for named colors, rgb(), hsl(), etc.
        const probe = document.createElement("span");
        probe.style.color = safeColor;
        probe.style.display = "none";
        document.body.appendChild(probe);
        const computed = getComputedStyle(probe).color;
        probe.remove();
        const rgbMatch = computed.match(/\d+/g);
        if (rgbMatch && rgbMatch.length >= 3) {
          return `${rgbMatch[0]}, ${rgbMatch[1]}, ${rgbMatch[2]}`;
        }
        return "167, 139, 250";
      }

      function normalizeTag(rawTag) {
        if (typeof rawTag !== "string") return null;
        const cleaned = rawTag.trim().replace(/\s+/g, "");
        if (!cleaned) return null;
        return cleaned.startsWith("#") ? cleaned : `#${cleaned}`;
      }

      function normalizeCharacterList(rawList) {
        const seenIds = new Set();
        return rawList
          .filter((item) => item && typeof item === "object")
          .map((item, idx) => {
            let id = item.id != null && String(item.id).trim() ? String(item.id).trim() : `char_${idx + 1}`;
            if (seenIds.has(id)) {
              id = `${id}_${idx + 1}`;
            }
            seenIds.add(id);

            const name = item.name != null && String(item.name).trim()
              ? String(item.name).trim()
              : "Unnamed Character";

            const avatar = typeof item.avatar === "string" ? item.avatar.trim() : "";
            const color = normalizeColor(item.color);
            const colorRgb = parseColorToRgb(color);
            const description = typeof item.description === "string" ? item.description.trim() : "";

            const rawTags = Array.isArray(item.hashtags) ? item.hashtags : [];
            const tagSeen = new Set();
            const hashtags = [];
            for (const t of rawTags) {
              const formatted = normalizeTag(t);
              if (!formatted) continue;
              const key = formatted.toLowerCase();
              if (!tagSeen.has(key)) {
                tagSeen.add(key);
                hashtags.push({ key, label: formatted });
              }
            }

            const storyLink = typeof item.storyLink === "string" ? item.storyLink.trim() : "";
            const viewLink = typeof item.viewLink === "string" ? item.viewLink.trim() : "";

            return {
              id,
              name,
              avatar,
              color,
              colorRgb,
              description,
              hashtags,
              storyLink,
              viewLink
            };
          });
      }

      function buildHashtagCatalog(charList) {
        const map = new Map();
        for (const char of charList) {
          for (const tag of char.hashtags) {
            if (!map.has(tag.key)) {
              map.set(tag.key, {
                key: tag.key,
                label: tag.label,
                count: 1
              });
            } else {
              map.get(tag.key).count += 1;
            }
          }
        }
        return Array.from(map.values());
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function sanitizeUrl(url) {
        if (!url) return "";
        const trimmed = url.trim();
        if (/^(javascript|data|vbscript):/i.test(trimmed)) return "";
        return trimmed;
      }

      function getInitials(name) {
        const parts = name.trim().split(/\s+/).filter(Boolean);
        if (parts.length === 0) return "OC";
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

      function getTagLabel(tagKey) {
        const found = hashtagCatalog.find((t) => t.key === tagKey);
        return found ? found.label : tagKey;
      }

      /* ---------- Filtering Logic ---------- */

      function getFilteredCharacters({ favoritesOnly = false } = {}) {
        const query = state.searchQuery.trim().toLowerCase();
        const activeKeys = state.activeTags;

        return normalizedCharacters.filter((char) => {
          if (favoritesOnly && !state.favorites.has(char.id)) {
            return false;
          }

          // Hashtag Filter (AND / OR Mode)
          if (activeKeys.length > 0) {
            const charTagKeys = new Set(char.hashtags.map((t) => t.key));
            if (state.filterMode === "AND") {
              for (const reqKey of activeKeys) {
                if (!charTagKeys.has(reqKey)) return false;
              }
            } else {
              const hasAny = activeKeys.some((reqKey) => charTagKeys.has(reqKey));
              if (!hasAny) return false;
            }
          }

          // Search Query Filter (works simultaneously with Hashtag filters)
          if (query) {
            const nameMatch = char.name.toLowerCase().includes(query);
            const descMatch = char.description.toLowerCase().includes(query);
            const tagMatch = char.hashtags.some((t) => t.label.toLowerCase().includes(query));
            if (!nameMatch && !descMatch && !tagMatch) return false;
          }

          return true;
        });
      }

      function getSortedHashtags(sortBy = state.librarySort) {
        const list = [...hashtagCatalog];
        if (sortBy === "alpha") {
          list.sort((a, b) => a.label.localeCompare(b.label, "vi", { sensitivity: "base" }));
        } else {
          list.sort((a, b) => {
            if (b.count !== a.count) return b.count - a.count;
            return a.label.localeCompare(b.label, "vi", { sensitivity: "base" });
          });
        }
        return list;
      }

      function getMasonryColumnCount() {
        const w = window.innerWidth;
        if (w >= 1320) return 4;
        if (w >= 900) return 3;
        if (w >= 520) return 2;
        return 1;
      }

      /* ---------- Actions & Feedback ---------- */

      function showToast(message, icon = ICONS.check) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.innerHTML = `<span style="color: var(--pastel-mint); display: grid; place-items: center;">${icon}</span><span>${escapeHtml(message)}</span>`;
        els.toastContainer.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translateY(8px)";
          toast.style.transition = "opacity 0.22s ease, transform 0.22s ease";
          setTimeout(() => toast.remove(), 240);
        }, 2400);
      }

      async function copyTextToClipboard(text) {
        if (!text) return;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            ta.remove();
          }
          showToast("Đã sao chép liên kết vào bộ nhớ tạm");
        } catch {
          showToast("Không thể tự động sao chép liên kết", ICONS.close);
        }
      }

      function toggleFavorite(charId) {
        if (state.favorites.has(charId)) {
          state.favorites.delete(charId);
          showToast("Đã bỏ khỏi Favorites", ICONS.heart);
        } else {
          state.favorites.add(charId);
          showToast("Đã lưu vào Favorites", ICONS.heart);
        }
        saveFavorites();
        renderNavigation();
        if (state.selectedCharacterId === charId) {
          renderDetailView(charId);
        } else {
          renderCurrentViewBody();
          renderHeaderStats();
        }
      }

      function toggleHashtagFilter(tagKey) {
        const idx = state.activeTags.indexOf(tagKey);
        if (idx >= 0) {
          state.activeTags.splice(idx, 1);
        } else {
          state.activeTags.push(tagKey);
        }
        updateHeaderControls();
        renderCurrentViewBody();
      }

      function selectSingleHashtagAndShowGallery(tagKey) {
        if (!state.activeTags.includes(tagKey)) {
          state.activeTags = [tagKey];
        }
        state.selectedCharacterId = null;
        if (state.currentView === "hashtags" || state.currentView === "settings") {
          state.currentView = "all";
        }
        syncHashUrl(null);
        renderAll();
      }

      function clearAllFilters(includeSearch = false) {
        state.activeTags = [];
        if (includeSearch) {
          state.searchQuery = "";
          els.searchInput.value = "";
        }
        updateHeaderControls();
        renderCurrentViewBody();
      }

      function setView(viewName) {
        state.previousView = state.currentView;
        state.currentView = viewName;
        state.selectedCharacterId = null;
        syncHashUrl(null);
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function openCharacterDetail(charId) {
        const exists = normalizedCharacters.some((c) => c.id === charId);
        if (!exists) return;
        state.previousView = state.currentView;
        state.selectedCharacterId = charId;
        syncHashUrl(charId);
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function closeCharacterDetail() {
        state.selectedCharacterId = null;
        syncHashUrl(null);
        renderAll();
      }

      function syncHashUrl(charId) {
        const targetHash = charId ? `#character=${encodeURIComponent(charId)}` : "";
        if (window.location.hash !== targetHash) {
          try {
            if (targetHash) {
              history.replaceState(null, "", targetHash);
            } else {
              history.replaceState(null, "", window.location.pathname + window.location.search);
            }
          } catch {
            // Fallback safe for restricted file:// environments
          }
        }
      }

      function applySettingsToDocument() {
        document.body.classList.toggle("no-effects", !state.settings.decorativeEffects);
        document.body.classList.toggle("sidebar-collapsed", Boolean(state.settings.sidebarCollapsed));
        const title = state.settings.siteTitle.trim() || DEFAULT_SETTINGS.siteTitle;
        document.title = title;
        els.headerTitle.textContent = title;
        els.mobileBrandTitle.textContent = title;
        els.sidebarBrandText.textContent = title;
        els.headerSubtitle.textContent = state.settings.siteDescription.trim();
      }

      /* ---------- Rendering Functions ---------- */

      function renderStaticIcons() {
        els.brandIcon.innerHTML = ICONS.spark;
        els.mobileBrandIcon.innerHTML = ICONS.spark;
        els.sidebarCollapseBtn.innerHTML = ICONS.chevronLeft;
        els.searchIconSlot.innerHTML = ICONS.search;
        els.searchClearBtn.innerHTML = ICONS.close;
        els.filterBtnIcon.innerHTML = ICONS.filter;
        els.tagPanelIcon.innerHTML = ICONS.hash;
        els.clearAllTagsBtn.innerHTML = `${ICONS.close}<span>Clear All</span>`;
        document.querySelectorAll(".view-icon-slot").forEach((slot) => {
          const iconName = slot.getAttribute("data-icon");
          if (ICONS[iconName]) slot.innerHTML = ICONS[iconName];
        });
      }

      function renderNavigation() {
        const navItems = [
          { id: "home", label: "Home", mobileLabel: "Home", icon: ICONS.home, badge: null },
          { id: "all", label: "All Characters", mobileLabel: "All", icon: ICONS.gallery, badge: normalizedCharacters.length },
          { id: "hashtags", label: "Hashtag Library", mobileLabel: "Hashtags", icon: ICONS.hash, badge: hashtagCatalog.length },
          { id: "favorites", label: "Favorites", mobileLabel: "Favorites", icon: ICONS.heart, badge: state.favorites.size },
          { id: "settings", label: "Settings", mobileLabel: "Settings", icon: ICONS.settings, badge: null }
        ];

        els.sidebarNav.innerHTML = navItems
          .map((item) => {
            const isActive = !state.selectedCharacterId && state.currentView === item.id;
            return `
              <button
                type="button"
                class="nav-item ${isActive ? "active" : ""}"
                data-nav="${item.id}"
                data-tooltip="${escapeHtml(item.label)}"
                aria-current="${isActive ? "page" : "false"}"
              >
                <span class="nav-icon">${item.icon}</span>
                <span class="nav-label">${escapeHtml(item.label)}</span>
                ${item.badge !== null ? `<span class="nav-badge">${item.badge}</span>` : ""}
              </button>
            `;
          })
          .join("");

        els.mobileBottomNav.innerHTML = navItems
          .map((item) => {
            const isActive = !state.selectedCharacterId && state.currentView === item.id;
            const showFavDot = item.id === "favorites" && state.favorites.size > 0;
            return `
              <button
                type="button"
                class="mobile-nav-btn ${isActive ? "active" : ""}"
                data-nav="${item.id}"
              >
                ${showFavDot ? '<span class="mobile-nav-dot"></span>' : ""}
                <span>${item.icon}</span>
                <span>${escapeHtml(item.mobileLabel)}</span>
              </button>
            `;
          })
          .join("");

        const totalCount = normalizedCharacters.length;
        const unit = totalCount === 1 ? "character" : "characters";
        els.sidebarFooterCount.textContent = `${totalCount} ${unit}`;
        els.mobileTotalPill.textContent = `${totalCount} OC`;
      }

      function renderHeaderStats() {
        const total = normalizedCharacters.length;
        const totalUnit = total === 1 ? "character" : "characters";
        els.headerCountText.textContent = `${total} ${totalUnit}`;

        const showHero = state.currentView === "home";
        els.headerHero.classList.toggle("compact", !showHero);
        els.headerSubtitle.classList.toggle("hidden", !state.settings.siteDescription.trim());

        if (showHero) {
          els.heroStats.classList.remove("hidden");
          els.heroStats.innerHTML = `
            <div class="hero-stat-box">
              <div class="hero-stat-value">${total}</div>
              <div class="hero-stat-label">Nhân vật</div>
            </div>
            <div class="hero-stat-box">
              <div class="hero-stat-value">${hashtagCatalog.length}</div>
              <div class="hero-stat-label">Hashtags</div>
            </div>
            <div class="hero-stat-box">
              <div class="hero-stat-value">${state.favorites.size}</div>
              <div class="hero-stat-label">Favorites</div>
            </div>
          `;
        } else {
          els.heroStats.classList.add("hidden");
        }
      }

      function updateHeaderControls() {
        const showHeader = !state.selectedCharacterId && ["home", "all", "favorites"].includes(state.currentView);
        els.archiveHeader.classList.toggle("hidden", !showHeader);
        if (!showHeader) return;

        renderHeaderStats();

        // Sync search clear button
        els.searchClearBtn.classList.toggle("hidden", !state.searchQuery);

        // Sync view mode buttons
        const mode = state.settings.galleryMode === "grid" ? "grid" : "masonry";
        els.viewMasonryBtn.classList.toggle("active", mode === "masonry");
        els.viewGridBtn.classList.toggle("active", mode === "grid");

        // Sync filter panel open/closed state
        els.hashtagFilterPanel.classList.toggle("hidden", !state.filterPanelOpen);
        els.toggleFilterPanelBtn.classList.toggle("active", state.filterPanelOpen || state.activeTags.length > 0);
        els.activeTagsBadge.textContent = state.activeTags.length;
        els.activeTagsBadge.classList.toggle("hidden", state.activeTags.length === 0);

        // Sync AND/OR buttons
        document.querySelectorAll(".mode-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.getAttribute("data-filter-mode") === state.filterMode);
        });

        // Clear All button
        els.clearAllTagsBtn.classList.toggle("hidden", state.activeTags.length === 0);

        // Render clickable hashtags in filter panel
        const sortedTags = getSortedHashtags("count");
        if (sortedTags.length === 0) {
          els.headerHashtagList.innerHTML = `<span style="font-size: 0.82rem; color: var(--text-muted);">Chưa có hashtag nào được khai báo trong dữ liệu nhân vật.</span>`;
        } else {
          els.headerHashtagList.innerHTML = sortedTags
            .map((tag) => {
              const selected = state.activeTags.includes(tag.key);
              return `
                <button
                  type="button"
                  class="tag-pill ${selected ? "selected" : ""}"
                  data-filter-tag="${escapeHtml(tag.key)}"
                  aria-pressed="${selected}"
                >
                  <span>${escapeHtml(tag.label)}</span>
                  <span class="tag-pill-count">${tag.count}</span>
                </button>
              `;
            })
            .join("");
        }

        // Active filter strip
        const hasFilters = state.activeTags.length > 0 || state.searchQuery.trim() !== "";
        els.activeFilterStrip.classList.toggle("hidden", !hasFilters);
        if (hasFilters) {
          const isFavView = state.currentView === "favorites";
          const matched = getFilteredCharacters({ favoritesOnly: isFavView });
          const tagsHtml = state.activeTags
            .map((key) => `
              <button type="button" class="tag-pill selected" data-filter-tag="${escapeHtml(key)}" title="Nhấn để bỏ lọc">
                <span>${escapeHtml(getTagLabel(key))}</span>
                <span style="display:inline-grid;place-items:center;opacity:0.8;">${ICONS.close}</span>
              </button>
            `)
            .join("");

          const modeBadge = state.activeTags.length > 1
            ? `<span style="font-family: var(--font-mono); font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,0.06); color: var(--text-secondary);">${state.filterMode} MODE</span>`
            : "";

          const queryBadge = state.searchQuery.trim()
            ? `<span style="font-size: 0.8rem; color: var(--text-secondary);">Từ khóa: <strong style="color:var(--text-primary);">"${escapeHtml(state.searchQuery.trim())}"</strong></span>`
            : "";

          els.activeFilterTags.innerHTML = `
            <span style="font-size: 0.8rem; color: var(--text-muted);">Đang lọc:</span>
            ${tagsHtml}
            ${modeBadge}
            ${queryBadge}
            <button type="button" class="clear-filter-btn" id="strip-clear-all-btn">${ICONS.close}<span>Xóa bộ lọc</span></button>
          `;

          els.activeResultsText.textContent = `${matched.length} kết quả`;
        }
      }

      function createCharacterCardHTML(char) {
        const isFav = state.favorites.has(char.id);
        const initials = getInitials(char.name);
        const maxVisibleTags = 3;
        const visibleTags = char.hashtags.slice(0, maxVisibleTags);
        const overflowCount = Math.max(0, char.hashtags.length - maxVisibleTags);

        const tagsHtml = char.hashtags.length > 0
          ? `
            <div class="card-tags">
              ${visibleTags
                .map((tag) => {
                  const selected = state.activeTags.includes(tag.key);
                  return `
                    <button
                      type="button"
                      class="tag-pill ${selected ? "selected" : ""}"
                      data-card-tag="${escapeHtml(tag.key)}"
                      aria-label="Lọc theo ${escapeHtml(tag.label)}"
                    >${escapeHtml(tag.label)}</button>
                  `;
                })
                .join("")}
              ${overflowCount > 0
                ? `<span class="tag-pill overflow-pill" title="${escapeHtml(char.hashtags.slice(maxVisibleTags).map((t) => t.label).join(", "))}">+${overflowCount}</span>`
                : ""}
            </div>
          `
          : "";

        return `
          <article
            class="char-card"
            tabindex="0"
            role="button"
            aria-label="Xem thông tin nhân vật ${escapeHtml(char.name)}"
            data-char-id="${escapeHtml(char.id)}"
            style="--char-accent: ${escapeHtml(char.color)}; --char-accent-rgb: ${char.colorRgb};"
          >
            <div class="card-aura" aria-hidden="true"></div>
            <div class="card-media">
              <div class="avatar-placeholder" aria-hidden="true">
                <div class="placeholder-ring">${escapeHtml(initials)}</div>
                <span class="placeholder-caption">Character Portrait</span>
              </div>
              ${char.avatar
                ? `<img class="card-avatar-img" src="${escapeHtml(char.avatar)}" alt="${escapeHtml(char.name)}" loading="lazy" />`
                : ""}
              <button
                type="button"
                class="fav-btn ${isFav ? "is-fav" : ""}"
                data-fav-id="${escapeHtml(char.id)}"
                aria-label="${isFav ? "Bỏ yêu thích" : "Đánh dấu yêu thích"} ${escapeHtml(char.name)}"
                aria-pressed="${isFav}"
              >${ICONS.heart}</button>
            </div>
            <div class="card-body">
              <div class="card-title-row">
                <span class="char-accent-dot" aria-hidden="true"></span>
                <h2 class="card-name">${escapeHtml(char.name)}</h2>
              </div>
              ${char.description ? `<p class="card-desc">${escapeHtml(char.description)}</p>` : ""}
              ${tagsHtml}
            </div>
          </article>
        `;
      }

      function attachImageHandlers(rootEl) {
        rootEl.querySelectorAll(".card-avatar-img, .detail-portrait-img").forEach((img) => {
          const mediaBox = img.closest(".card-media, .detail-portrait-card");
          if (!mediaBox) return;

          const markLoaded = () => {
            if (img.naturalWidth > 0) {
              mediaBox.classList.add("img-loaded");
            }
          };

          const markError = () => {
            mediaBox.classList.remove("img-loaded");
            img.remove();
          };

          if (img.complete) {
            if (img.naturalWidth > 0) {
              markLoaded();
            } else {
              markError();
            }
          } else {
            img.addEventListener("load", markLoaded, { once: true });
            img.addEventListener("error", markError, { once: true });
          }
        });
      }

      function renderGalleryMarkup(list, emptyOptions = {}) {
        if (list.length === 0) {
          const {
            title = "Không tìm thấy nhân vật phù hợp",
            description = "Thử thay đổi từ khóa tìm kiếm hoặc điều chỉnh bộ lọc hashtag.",
            showClearBtn = state.activeTags.length > 0 || state.searchQuery.trim() !== ""
          } = emptyOptions;

          return `
            <div class="empty-state">
              <div class="empty-icon-box">${ICONS.spark}</div>
              <h3 class="empty-title">${escapeHtml(title)}</h3>
              <p class="empty-desc">${escapeHtml(description)}</p>
              ${showClearBtn
                ? `<button type="button" class="clear-filter-btn" id="empty-clear-filter-btn">${ICONS.close}<span>Xóa bộ lọc</span></button>`
                : ""}
            </div>
          `;
        }

        const mode = state.settings.galleryMode === "grid" ? "grid" : "masonry";

        if (mode === "grid") {
          return `
            <div class="gallery-grid">
              ${list.map((char) => createCharacterCardHTML(char)).join("")}
            </div>
          `;
        }

        // Masonry View with responsive column distribution (left-to-right reading order)
        const colCount = Math.min(state.masonryCols, Math.max(1, list.length));
        const columns = Array.from({ length: colCount }, () => []);
        list.forEach((char, index) => {
          columns[index % colCount].push(createCharacterCardHTML(char));
        });

        return `
          <div class="gallery-masonry">
            ${columns
              .map((colCards) => `<div class="masonry-column">${colCards.join("")}</div>`)
              .join("")}
          </div>
        `;
      }

      function renderGalleryView({ favoritesOnly = false } = {}) {
        const list = getFilteredCharacters({ favoritesOnly });

        let emptyConfig = {};
        if (normalizedCharacters.length === 0) {
          emptyConfig = {
            title: "Thư viện hiện chưa có nhân vật nào",
            description: "Mở tệp HTML này bằng trình soạn thảo code và thêm nhân vật vào mảng characters để bắt đầu trưng bày.",
            showClearBtn: false
          };
        } else if (favoritesOnly && state.favorites.size === 0) {
          emptyConfig = {
            title: "Chưa có nhân vật yêu thích",
            description: "Nhấn vào biểu tượng trái tim trên thẻ nhân vật để lưu các nhân vật yêu thích của bạn tại đây.",
            showClearBtn: false
          };
        }

        els.viewBody.innerHTML = renderGalleryMarkup(list, emptyConfig);
        attachImageHandlers(els.viewBody);
      }

      function renderHashtagLibraryView() {
        const sortedTags = getSortedHashtags(state.librarySort);
        const filteredChars = state.activeTags.length > 0 ? getFilteredCharacters() : [];

        const tagCardsHtml = sortedTags.length === 0
          ? `
            <div class="empty-state">
              <div class="empty-icon-box">${ICONS.hash}</div>
              <h3 class="empty-title">Chưa có hashtag nào</h3>
              <p class="empty-desc">Hashtag sẽ được tự động tổng hợp ngay khi bạn gắn hashtag cho nhân vật trong mảng dữ liệu characters.</p>
            </div>
          `
          : `
            <div class="hashtag-library-grid">
              ${sortedTags
                .map((tag) => {
                  const selected = state.activeTags.includes(tag.key);
                  const unit = tag.count === 1 ? "character" : "characters";
                  return `
                    <button
                      type="button"
                      class="hashtag-lib-card ${selected ? "selected" : ""}"
                      data-lib-tag="${escapeHtml(tag.key)}"
                      aria-pressed="${selected}"
                    >
                      <span class="hashtag-lib-name">${escapeHtml(tag.label)}</span>
                      <span class="hashtag-lib-count">${tag.count} ${unit}</span>
                    </button>
                  `;
                })
                .join("")}
            </div>
          `;

        const resultsSectionHtml = state.activeTags.length > 0
          ? `
            <div class="library-results-header">
              <div class="library-results-title">
                <span>Nhân vật phù hợp (${filteredChars.length})</span>
                ${state.activeTags
                  .map((k) => `<span class="tag-pill selected" style="cursor:default;">${escapeHtml(getTagLabel(k))}</span>`)
                  .join("")}
              </div>
              <div class="library-controls">
                <div class="mode-switch" role="group" aria-label="Chế độ lọc nhiều hashtag">
                  <button type="button" class="mode-btn ${state.filterMode === "AND" ? "active" : ""}" data-filter-mode="AND">AND MODE</button>
                  <button type="button" class="mode-btn ${state.filterMode === "OR" ? "active" : ""}" data-filter-mode="OR">OR MODE</button>
                </div>
                <button type="button" class="clear-filter-btn" id="lib-clear-btn">${ICONS.close}<span>Clear All</span></button>
                <button type="button" class="btn-ghost" id="lib-open-gallery-btn" style="height: 34px; padding: 0 12px; font-size: 0.8rem;">
                  <span>Mở trong Gallery</span>
                </button>
              </div>
            </div>
            ${renderGalleryMarkup(filteredChars, {
              title: "Không có nhân vật nào khớp tổ hợp hashtag này",
              description: "Thử chuyển giữa AND MODE và OR MODE hoặc bỏ chọn bớt hashtag.",
              showClearBtn: true
            })}
          `
          : "";

        els.viewBody.innerHTML = `
          <div class="library-header-card">
            <div>
              <h1 class="library-title">HASHTAG LIBRARY</h1>
              <p class="library-desc">Tự động tổng hợp ${hashtagCatalog.length} hashtag đang sử dụng trong thư viện. Nhấn để chọn một hoặc nhiều hashtag.</p>
            </div>
            <div class="library-controls">
              <div class="segmented" role="group" aria-label="Sắp xếp hashtag">
                <button type="button" class="segmented-btn ${state.librarySort === "count" ? "active" : ""}" data-lib-sort="count">
                  ${ICONS.sort}
                  <span>Số lượng</span>
                </button>
                <button type="button" class="segmented-btn ${state.librarySort === "alpha" ? "active" : ""}" data-lib-sort="alpha">
                  <span>A–Z</span>
                </button>
              </div>
            </div>
          </div>
          ${tagCardsHtml}
          ${resultsSectionHtml}
        `;

        attachImageHandlers(els.viewBody);
      }

      function renderDetailView(charId) {
        const char = normalizedCharacters.find((c) => c.id === charId);
        if (!char) {
          closeCharacterDetail();
          return;
        }

        const isFav = state.favorites.has(char.id);
        const initials = getInitials(char.name);
        const safeStory = sanitizeUrl(char.storyLink);
        const safeView = sanitizeUrl(char.viewLink);

        const storyBlock = safeStory
          ? `
            <div class="link-url-preview" title="${escapeHtml(safeStory)}">${escapeHtml(safeStory)}</div>
            <div class="link-card-actions">
              <a class="btn-accent" href="${escapeHtml(safeStory)}" target="_blank" rel="noopener noreferrer">
                ${ICONS.external}
                <span>Open Story</span>
              </a>
              <button type="button" class="btn-copy" data-copy-url="${escapeHtml(safeStory)}">
                ${ICONS.copy}
                <span>Copy Link</span>
              </button>
            </div>
          `
          : `
            <div class="link-empty-status">
              <span>Chưa cập nhật đường dẫn cốt truyện</span>
            </div>
          `;

        const viewBlock = safeView
          ? `
            <div class="link-url-preview" title="${escapeHtml(safeView)}">${escapeHtml(safeView)}</div>
            <div class="link-card-actions">
              <a class="btn-accent" href="${escapeHtml(safeView)}" target="_blank" rel="noopener noreferrer">
                ${ICONS.external}
                <span>Open Character</span>
              </a>
              <button type="button" class="btn-copy" data-copy-url="${escapeHtml(safeView)}">
                ${ICONS.copy}
                <span>Copy Link</span>
              </button>
            </div>
          `
          : `
            <div class="link-empty-status">
              <span>Chưa cập nhật đường dẫn xem nhân vật</span>
            </div>
          `;

        els.viewBody.innerHTML = `
          <div class="detail-page" style="--char-accent: ${escapeHtml(char.color)}; --char-accent-rgb: ${char.colorRgb};">
            <div class="detail-ambient-glow" aria-hidden="true"></div>

            <div class="detail-topbar">
              <button type="button" class="back-btn" id="detail-back-btn">
                ${ICONS.arrowLeft}
                <span>Quay lại thư viện</span>
              </button>

              <button
                type="button"
                class="detail-fav-btn ${isFav ? "is-fav" : ""}"
                data-fav-id="${escapeHtml(char.id)}"
                aria-pressed="${isFav}"
              >
                ${ICONS.heart}
                <span>${isFav ? "Favorited" : "Favorite"}</span>
              </button>
            </div>

            <div class="detail-layout">
              <div class="detail-portrait-card">
                <div class="avatar-placeholder" aria-hidden="true">
                  <div class="placeholder-ring" style="width: 96px; height: 96px; font-size: 1.85rem;">${escapeHtml(initials)}</div>
                  <span class="placeholder-caption">${escapeHtml(char.name)}</span>
                </div>
                ${char.avatar
                  ? `<img class="detail-portrait-img" src="${escapeHtml(char.avatar)}" alt="${escapeHtml(char.name)}" />`
                  : ""}
              </div>

              <div class="detail-info-panel">
                <div class="detail-header-block">
                  <span class="detail-accent-badge">
                    <span class="char-accent-dot" aria-hidden="true"></span>
                    <span>${escapeHtml(char.id)}</span>
                  </span>
                  <h1 class="detail-name">${escapeHtml(char.name)}</h1>
                  ${char.description
                    ? `<p class="detail-description">${escapeHtml(char.description)}</p>`
                    : ""}
                </div>

                <div>
                  <div class="detail-section-label">Hashtags (${char.hashtags.length})</div>
                  ${char.hashtags.length > 0
                    ? `
                      <div class="detail-tags-wrap">
                        ${char.hashtags
                          .map((tag) => `
                            <button
                              type="button"
                              class="tag-pill"
                              data-detail-tag="${escapeHtml(tag.key)}"
                              title="Nhấn để lọc tất cả nhân vật có ${escapeHtml(tag.label)}"
                            >${escapeHtml(tag.label)}</button>
                          `)
                          .join("")}
                      </div>
                    `
                    : `<p style="font-size: 0.85rem; color: var(--text-muted);">Chưa có hashtag.</p>`}
                </div>

                <div class="detail-links-grid">
                  <div class="link-card">
                    <div class="link-card-head">
                      <span class="link-card-icon">${ICONS.book}</span>
                      <span class="link-card-title">STORY LINK</span>
                    </div>
                    ${storyBlock}
                  </div>

                  <div class="link-card">
                    <div class="link-card-head">
                      <span class="link-card-icon">${ICONS.user}</span>
                      <span class="link-card-title">VIEW LINK</span>
                    </div>
                    ${viewBlock}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        attachImageHandlers(els.viewBody);
      }

      function renderSettingsView() {
        els.viewBody.innerHTML = `
          <div class="settings-wrap">
            <div class="library-header-card" style="margin-bottom: 4px;">
              <div>
                <h1 class="library-title">SETTINGS</h1>
                <p class="library-desc">Tùy chỉnh giao diện hiển thị của thư viện cá nhân.</p>
              </div>
            </div>

            <div class="settings-card">
              <h2 class="settings-card-title">Thông tin hiển thị thư viện</h2>

              <div class="field-group">
                <label class="field-label" for="setting-site-title">Tên thư viện</label>
                <input
                  type="text"
                  id="setting-site-title"
                  class="field-input"
                  value="${escapeHtml(state.settings.siteTitle)}"
                  placeholder="CHARACTER ARCHIVE"
                />
              </div>

              <div class="field-group">
                <label class="field-label" for="setting-site-desc">Mô tả ngắn</label>
                <textarea
                  id="setting-site-desc"
                  class="field-textarea"
                  placeholder="Mô tả ngắn gọn về thư viện OC của bạn..."
                >${escapeHtml(state.settings.siteDescription)}</textarea>
              </div>
            </div>

            <div class="settings-card">
              <h2 class="settings-card-title">Bố cục &amp; Hiệu ứng</h2>

              <div class="setting-row">
                <div class="setting-row-info">
                  <h4>Kiểu hiển thị Gallery</h4>
                  <p>Masonry hiển thị chiều cao tự nhiên; Grid giữ kích thước thẻ đồng đều.</p>
                </div>
                <div class="segmented" role="group" aria-label="Chọn kiểu Gallery">
                  <button type="button" class="segmented-btn ${state.settings.galleryMode === "masonry" ? "active" : ""}" data-setting-gallery="masonry">Masonry</button>
                  <button type="button" class="segmented-btn ${state.settings.galleryMode === "grid" ? "active" : ""}" data-setting-gallery="grid">Grid</button>
                </div>
              </div>

              <div class="setting-row">
                <div class="setting-row-info">
                  <h4>Hiệu ứng ánh sáng &amp; trang trí</h4>
                  <p>Bật hoặc tắt các quầng sáng màu chủ đạo và nền gradient pastel.</p>
                </div>
                <label class="switch">
                  <input type="checkbox" id="setting-effects-toggle" ${state.settings.decorativeEffects ? "checked" : ""} />
                  <span class="switch-slider"></span>
                </label>
              </div>

              <div class="setting-row">
                <div class="setting-row-info">
                  <h4>Thu gọn Sidebar (Desktop)</h4>
                  <p>Chỉ hiển thị biểu tượng gọn gàng trên thanh điều hướng bên trái.</p>
                </div>
                <label class="switch">
                  <input type="checkbox" id="setting-sidebar-toggle" ${state.settings.sidebarCollapsed ? "checked" : ""} />
                  <span class="switch-slider"></span>
                </label>
              </div>
            </div>

            <div class="settings-card">
              <div class="setting-row">
                <div class="setting-row-info">
                  <h4>Khôi phục cài đặt giao diện mặc định</h4>
                  <p>Đặt lại tên thư viện, mô tả và hiệu ứng. Không ảnh hưởng dữ liệu nhân vật hay Favorites.</p>
                </div>
                <button type="button" class="btn-ghost" id="reset-settings-btn">Đặt lại mặc định</button>
              </div>
            </div>
          </div>
        `;
      }

      function renderCurrentViewBody() {
        if (state.selectedCharacterId) {
          renderDetailView(state.selectedCharacterId);
          return;
        }
        switch (state.currentView) {
          case "home":
          case "all":
            renderGalleryView({ favoritesOnly: false });
            break;
          case "favorites":
            renderGalleryView({ favoritesOnly: true });
            break;
          case "hashtags":
            renderHashtagLibraryView();
            break;
          case "settings":
            renderSettingsView();
            break;
          default:
            renderGalleryView({ favoritesOnly: false });
        }
      }

      function renderAll() {
        applySettingsToDocument();
        renderNavigation();
        updateHeaderControls();
        renderCurrentViewBody();
      }

      /* ---------- Event Wiring ---------- */

      function setupEvents() {
        // Sidebar & Mobile Nav clicks
        const handleNavClick = (e) => {
          const btn = e.target.closest("[data-nav]");
          if (!btn) return;
          setView(btn.getAttribute("data-nav"));
        };
        els.sidebarNav.addEventListener("click", handleNavClick);
        els.mobileBottomNav.addEventListener("click", handleNavClick);

        // Sidebar collapse button
        els.sidebarCollapseBtn.addEventListener("click", () => {
          state.settings.sidebarCollapsed = !state.settings.sidebarCollapsed;
          saveSettings();
          applySettingsToDocument();
          if (state.currentView === "settings" && !state.selectedCharacterId) {
            renderSettingsView();
          }
        });

        // Search input (live filtering without losing focus)
        els.searchInput.addEventListener("input", (e) => {
          state.searchQuery = e.target.value;
          updateHeaderControls();
          renderCurrentViewBody();
        });

        els.searchClearBtn.addEventListener("click", () => {
          state.searchQuery = "";
          els.searchInput.value = "";
          els.searchInput.focus();
          updateHeaderControls();
          renderCurrentViewBody();
        });

        // Toggle filter panel visibility
        els.toggleFilterPanelBtn.addEventListener("click", () => {
          state.filterPanelOpen = !state.filterPanelOpen;
          updateHeaderControls();
        });

        // View mode switcher (Masonry / Grid)
        [els.viewMasonryBtn, els.viewGridBtn].forEach((btn) => {
          btn.addEventListener("click", () => {
            const mode = btn.getAttribute("data-view-mode");
            if (state.settings.galleryMode !== mode) {
              state.settings.galleryMode = mode;
              saveSettings();
              updateHeaderControls();
              renderCurrentViewBody();
            }
          });
        });

        // Header filter bar clicks (tags, AND/OR mode, Clear All)
        els.archiveHeader.addEventListener("click", (e) => {
          const tagBtn = e.target.closest("[data-filter-tag]");
          if (tagBtn) {
            toggleHashtagFilter(tagBtn.getAttribute("data-filter-tag"));
            return;
          }

          const modeBtn = e.target.closest("[data-filter-mode]");
          if (modeBtn) {
            const nextMode = modeBtn.getAttribute("data-filter-mode");
            if (state.filterMode !== nextMode) {
              state.filterMode = nextMode;
              updateHeaderControls();
              renderCurrentViewBody();
            }
            return;
          }

          if (e.target.closest("#clear-all-tags-btn")) {
            clearAllFilters(false);
            return;
          }

          if (e.target.closest("#strip-clear-all-btn")) {
            clearAllFilters(true);
          }
        });

        // Dynamic Body Delegated Events
        els.viewBody.addEventListener("click", (e) => {
          // Favorite button on Card or Detail View
          const favBtn = e.target.closest("[data-fav-id]");
          if (favBtn) {
            e.stopPropagation();
            toggleFavorite(favBtn.getAttribute("data-fav-id"));
            return;
          }

          // Hashtag clicked directly inside a Card
          const cardTagBtn = e.target.closest("[data-card-tag]");
          if (cardTagBtn) {
            e.stopPropagation();
            const key = cardTagBtn.getAttribute("data-card-tag");
            if (state.currentView === "hashtags") {
              selectSingleHashtagAndShowGallery(key);
            } else {
              toggleHashtagFilter(key);
            }
            return;
          }

          // Character Card click -> open Detail View
          const card = e.target.closest(".char-card[data-char-id]");
          if (card) {
            openCharacterDetail(card.getAttribute("data-char-id"));
            return;
          }

          // Detail View actions
          if (e.target.closest("#detail-back-btn")) {
            closeCharacterDetail();
            return;
          }

          const detailTagBtn = e.target.closest("[data-detail-tag]");
          if (detailTagBtn) {
            selectSingleHashtagAndShowGallery(detailTagBtn.getAttribute("data-detail-tag"));
            return;
          }

          const copyBtn = e.target.closest("[data-copy-url]");
          if (copyBtn) {
            copyTextToClipboard(copyBtn.getAttribute("data-copy-url"));
            return;
          }

          // Hashtag Library actions
          const libTagCard = e.target.closest("[data-lib-tag]");
          if (libTagCard) {
            toggleHashtagFilter(libTagCard.getAttribute("data-lib-tag"));
            return;
          }

          const sortBtn = e.target.closest("[data-lib-sort]");
          if (sortBtn) {
            state.librarySort = sortBtn.getAttribute("data-lib-sort");
            renderHashtagLibraryView();
            return;
          }

          const libModeBtn = e.target.closest("[data-filter-mode]");
          if (libModeBtn) {
            state.filterMode = libModeBtn.getAttribute("data-filter-mode");
            renderHashtagLibraryView();
            return;
          }

          if (e.target.closest("#lib-clear-btn") || e.target.closest("#empty-clear-filter-btn")) {
            clearAllFilters(true);
            return;
          }

          if (e.target.closest("#lib-open-gallery-btn")) {
            setView("all");
            return;
          }

          // Settings actions
          const settingGalleryBtn = e.target.closest("[data-setting-gallery]");
          if (settingGalleryBtn) {
            state.settings.galleryMode = settingGalleryBtn.getAttribute("data-setting-gallery");
            saveSettings();
            renderSettingsView();
            showToast(`Đã chuyển kiểu Gallery sang ${state.settings.galleryMode === "grid" ? "Grid" : "Masonry"}`);
            return;
          }

          if (e.target.closest("#reset-settings-btn")) {
            state.settings = { ...DEFAULT_SETTINGS };
            saveSettings();
            applySettingsToDocument();
            renderSettingsView();
            showToast("Đã đặt lại cài đặt giao diện mặc định");
          }
        });

        // Keyboard support for character cards + Escape from Detail View
        els.viewBody.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            const card = e.target.closest(".char-card[data-char-id]");
            if (card && e.target === card) {
              e.preventDefault();
              openCharacterDetail(card.getAttribute("data-char-id"));
            }
          }
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && state.selectedCharacterId) {
            closeCharacterDetail();
          }
        });

        // Live Settings inputs
        els.viewBody.addEventListener("input", (e) => {
          if (e.target.id === "setting-site-title") {
            state.settings.siteTitle = e.target.value;
            saveSettings();
            applySettingsToDocument();
          } else if (e.target.id === "setting-site-desc") {
            state.settings.siteDescription = e.target.value;
            saveSettings();
            applySettingsToDocument();
          }
        });

        els.viewBody.addEventListener("change", (e) => {
          if (e.target.id === "setting-effects-toggle") {
            state.settings.decorativeEffects = e.target.checked;
            saveSettings();
            applySettingsToDocument();
          } else if (e.target.id === "setting-sidebar-toggle") {
            state.settings.sidebarCollapsed = e.target.checked;
            saveSettings();
            applySettingsToDocument();
          }
        });

        // Responsive Masonry Column Reflow
        window.addEventListener("resize", () => {
          const nextCols = getMasonryColumnCount();
          if (nextCols !== state.masonryCols) {
            state.masonryCols = nextCols;
            if (!state.selectedCharacterId && state.settings.galleryMode === "masonry" && ["home", "all", "favorites", "hashtags"].includes(state.currentView)) {
              renderCurrentViewBody();
            }
          }
        });

        // Browser Hash Sync
        window.addEventListener("hashchange", () => {
          const match = window.location.hash.match(/^#character=(.+)$/);
          if (match) {
            const id = decodeURIComponent(match[1]);
            if (normalizedCharacters.some((c) => c.id === id)) {
              state.selectedCharacterId = id;
              renderAll();
              return;
            }
          }
          if (state.selectedCharacterId) {
            state.selectedCharacterId = null;
            renderAll();
          }
        });
      }

      /* ---------- Bootstrap ---------- */

      function init() {
        state.masonryCols = getMasonryColumnCount();
        renderStaticIcons();
        setupEvents();

        // Restore character detail if opened via direct #character=... hash
        const hashMatch = window.location.hash.match(/^#character=(.+)$/);
        if (hashMatch) {
          const id = decodeURIComponent(hashMatch[1]);
          if (normalizedCharacters.some((c) => c.id === id)) {
            state.selectedCharacterId = id;
          }
        }

        renderAll();
      }

      init();
    })();
  </script>
</body>
</html>
